name: Load Test

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of concurrent users"
        required: true
        default: "10"
      duration:
        description: "Test duration"
        required: true
        default: "1m"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/load-tester

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Get ALB URL
        id: alb
        run: |
          hostname=$(kubectl get ingress -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
          if [ -z "$hostname" ]; then
            echo "ALB hostname not available"
            exit 1
          fi
          echo "url=http://$hostname" >> "$GITHUB_OUTPUT"

      - name: Run Locust
        run: |
          locust \
            -f locustfile.py \
            --headless \
            -u "${{ inputs.users }}" \
            -t "${{ inputs.duration }}" \
            --host "${{ steps.alb.outputs.url }}"
