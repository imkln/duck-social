name: Deploy
run-name: Deploy ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Helm action"
        required: true
        type: choice
        options:
          - upgrade
          - uninstall

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  HELM_RELEASE_NAME: ${{ vars.HELM_RELEASE_NAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    if: inputs.action == 'upgrade'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - feed-service
          - post-service
          - ad-service
          - user-service
          - trending-service

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./src/${{ matrix.service }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ matrix.service }}-${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  upgrade:
    needs: build
    if: inputs.action == 'upgrade'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Build Helm dependencies
        run: helm dependency build ./helm/duck-social

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./helm/duck-social \
            --set "image.repository=$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set "image.tag=$IMAGE_TAG" \
            --wait \
            --timeout 10m \
            --rollback-on-failure

  uninstall:
    if: inputs.action == 'uninstall'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Helm uninstall
        run: helm uninstall ${{ env.HELM_RELEASE_NAME }}
