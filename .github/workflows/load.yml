name: Load Data

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Number of users"
        required: true
        default: "20"
      posts:
        description: "Number of posts"
        required: true
        default: "50"
      ads:
        description: "Number of ads"
        required: true
        default: "3"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}

jobs:
  load:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/data-loader

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set Up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Get ALB URL
        id: alb
        run: |
          hostname=$(kubectl get ingress -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}')
          if [ -z "$hostname" ]; then
            echo "ALB hostname not available"
            exit 1
          fi
          echo "url=http://$hostname" >> "$GITHUB_OUTPUT"

      - name: Load Data
        run: |
          python data-loader.py \
            --base-url "${{ steps.alb.outputs.url }}" \
            --users "${{ inputs.users }}" \
            --posts "${{ inputs.posts }}" \
            --ads "${{ inputs.ads }}"
